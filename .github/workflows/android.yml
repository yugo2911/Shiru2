name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_confirmed:
        description: 'I have verified the version in capacitor/package.json/electron/package.json and confirm this release is intentional'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.yml'

env:
  NODE_VERSION: '24.19.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.version_confirmed == true }}
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'bun'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Native + Web
        run: bun run build:app

      - name: Build Android APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Stop Gradle Daemon
        run: cd android && ./gradlew --stop

      - name: Sign Android APK
        id: sign_app
        uses: ilharp/sign-android-release@v1
        with:
          releaseDir: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mv ${{ steps.sign_app.outputs.signedFile }} Shiru.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shiru-Android
          path: Shiru.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.sha }}
          name: Android Build ${{ github.sha }}
          files: Shiru.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
